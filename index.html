<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a1c3f,#15417f);font-family:system-ui,sans-serif;color:#eaf2ff;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
[hidden]{display:none!important}
#display{position:relative;flex:0 0 auto;height:26vh;min-height:150px;background:#07142e;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);padding:6px 10px;display:flex;flex-direction:column;border-bottom:2px solid #2a5db0}
#top{display:flex;align-items:center;gap:8px;min-height:20px}
#ind{color:#9fe8a0;font-size:12px;letter-spacing:1px;white-space:pre;flex:1;overflow:hidden}
#snd{background:none;border:none;color:#9fe8a0;padding:2px;display:flex}
#exprbox{flex:1;overflow:auto;padding:6px 2px;scrollbar-width:thin;scrollbar-color:#2f6fd0 #0a1a38}
#exprbox::-webkit-scrollbar{width:8px;height:8px}
#exprbox::-webkit-scrollbar-track{background:#0a1a38}
#exprbox::-webkit-scrollbar-thumb{background:#2f6fd0;border-radius:4px}
#expr{display:inline-flex;align-items:center;min-width:100%;justify-content:flex-end;font-size:24px;color:#fff}
#res{font-size:34px;color:#b8e986;text-align:right;min-height:44px;line-height:44px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;display:flex;justify-content:flex-end;align-items:center}
#res::-webkit-scrollbar{display:none}
#res.err{color:#ff5f6d;font-size:24px}
.slot{display:inline-flex;align-items:center}
.slot.empty{min-width:.7em;min-height:1.1em;border:1px dashed #3b6db3;border-radius:3px;margin:0 1px}
.caret{display:inline-block;width:2px;height:1.25em;background:#b8e986;margin:0 1px;animation:bl 1s steps(2) infinite;flex:none}
@keyframes bl{50%{opacity:0}}
.n{display:inline-flex;align-items:center}
.op{margin:0 4px;color:#cfe3ff}
.post{font-size:.85em;transform:translateY(-.25em)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.fr>.fn_{padding:1px 5px}
.fr>.fd{padding:1px 5px;border-top:2px solid #cfe3ff}
.mx{display:inline-flex;align-items:center}
.pw{display:inline-flex;align-items:flex-start}
.pw>.pe{font-size:.66em;transform:translateY(-.5em);display:inline-flex;align-items:center}
.rd{display:inline-flex;align-items:stretch;margin:0 2px}
.rd svg{width:.55em;align-self:stretch;flex:none}
.rd>.rb{border-top:2px solid currentColor;padding:2px 4px 0;display:inline-flex;align-items:center}
.rd>.ri{font-size:.6em;align-self:flex-start;transform:translate(.35em,-.15em);margin-right:-.3em;display:inline-flex;align-items:center;z-index:1}
.pa{display:inline-flex;align-items:stretch;margin:0 2px}
.pa>.pl,.pa>.pr{width:.32em;border:2px solid #86b7ff;flex:none}
.pa>.pl{border-right:none;border-radius:7px 0 0 7px}
.pa>.pr{border-left:none;border-radius:0 7px 7px 0}
.pa>.pb{display:inline-flex;align-items:center;padding:1px 3px}
.ab{display:inline-flex;align-items:stretch;margin:0 2px}
.ab>.bar{width:2px;background:#86b7ff;flex:none}
.ab>.pb{display:inline-flex;align-items:center;padding:1px 4px}
.fnn{color:#9fc6ff;margin-right:1px}
.sub{font-size:.62em;transform:translateY(.35em);display:inline-flex;align-items:center}
.big{display:inline-flex;align-items:center;margin:0 2px}
.big>.sym{font-size:1.65em;line-height:1;color:#cfe3ff}
.big>.lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.6em;height:2.6em;margin:0 2px}
.big>.lims>span{display:inline-flex;align-items:center}
.dX{color:#9fc6ff;margin-left:3px;font-size:.85em}
.der{display:inline-flex;align-items:center}
.der>.df{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;margin-right:2px}
.der>.df>span:last-child{border-top:2px solid #cfe3ff;padding:0 3px}
.der>.ev{border-left:2px solid #86b7ff;align-self:stretch;margin-left:2px}
.dmssep{color:#9fc6ff;margin:0 1px}
#keys{flex:1;display:flex;flex-direction:column;gap:4px;padding:5px;min-height:0}
.sci{flex:1.2;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:4px}
.dig{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:4px}
button{border:1px solid #23477f;background:#0f2650;color:#fff;border-radius:6px;font-size:16px;font-family:inherit;padding:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:0;position:relative;overflow:hidden}
button:active{background:#1c3d78}
.sl{font-size:9px;color:#8fd694;line-height:9px;height:10px}
.dig button{font-size:22px;background:#0c1e42}
.fnk{font-size:13px}
.red{color:#ff5f6d}
.eq{background:#173a75}
.eq .hold{position:absolute;left:0;bottom:0;height:3px;width:0;background:#b8e986}
.eq.holding .hold{width:100%;transition:width .5s linear}
#shiftBtn.on{background:#1e5c34;border-color:#3f9e5f}
#sheet{position:fixed;inset:0;background:rgba(4,10,24,.72);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
#panel{background:#0a1a38;border-top:2px solid #2a5db0;border-radius:14px 14px 0 0;max-height:80vh;display:flex;flex-direction:column}
#phead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#9fe8a0;font-size:15px}
#phead button{font-size:13px;padding:5px 12px;background:#12305e}
#pbody{overflow-y:auto;padding:0 14px 18px;scrollbar-width:thin;scrollbar-color:#2f6fd0 #0a1a38}
#pbody::-webkit-scrollbar{width:8px}
#pbody::-webkit-scrollbar-track{background:#0a1a38}
#pbody::-webkit-scrollbar-thumb{background:#2f6fd0;border-radius:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid #14305e;font-size:14px}
.row select,.row input[type=number]{background:#0f2650;color:#fff;border:1px solid #23477f;border-radius:6px;padding:6px;font-size:14px;max-width:55%}
.row input[type=range]{flex:1;accent-color:#b8e986}
.tgl{width:46px;height:24px;border-radius:12px;background:#223a63;border:1px solid #2f5c9e;position:relative;flex:none;padding:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#7d94bd;transition:left .15s}
.tgl.on{background:#1e5c34}
.tgl.on::after{left:24px;background:#b8e986}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid #14305e;font-size:14px}
.crow .cs{color:#b8e986;font-size:17px;min-width:44px}
.crow .cn{flex:1;color:#cfe3ff}
.crow .cv{color:#8fa8cf;font-size:12px}
.hrow{padding:8px 2px;border-bottom:1px solid #14305e;display:flex;align-items:center;gap:8px}
.hrow .he{flex:1;color:#8fa8cf;font-size:12px;word-break:break-all}
.hrow .hr{color:#b8e986;font-size:16px}
.hrow button{font-size:12px;padding:5px 9px;background:#12305e;flex:none}
.convout{color:#b8e986;font-size:20px;text-align:right;padding:10px 2px}
.insbtn{width:100%;padding:10px;background:#1e5c34;border-color:#3f9e5f;font-size:15px;margin-top:6px}
@media(max-height:680px){#res{font-size:28px}#expr{font-size:20px}button{font-size:13px}.dig button{font-size:18px}.sl{font-size:8px}}
</style>
</head>
<body>
<div id="display">
  <div id="top">
    <div id="ind"></div>
    <button id="snd" title="Ήχος"></button>
  </div>
  <div id="exprbox"><div id="expr"></div></div>
  <div id="res">0</div>
</div>
<div id="keys">
  <div class="sci" id="sci"></div>
  <div class="dig" id="dig"></div>
</div>
<div id="sheet" hidden>
  <div id="panel">
    <div id="phead"><span id="ptitle"></span><button id="pclose">Κλείσιμο</button></div>
    <div id="pbody"></div>
  </div>
</div>
<script>
"use strict";
/* ---------- κατάσταση ---------- */
const D={angle:"DEG",fmt:"AUTO",sd:0,base:"DEC",dms:false,prec:10,sound:true,vib:true};
const S={root:[],cur:null,shift:false,hyp:false,fresh:false,err:false,ans:0,mem:0,hist:[]};
S.root.meta=null;S.cur={arr:S.root,i:0};
try{const d=JSON.parse(localStorage.getItem("sciCalc2"));if(d){Object.assign(D,d.D||{});S.ans=d.ans||0;S.mem=d.mem||0;S.hist=d.hist||[];}}catch(e){}
function save(){try{localStorage.setItem("sciCalc2",JSON.stringify({D,ans:S.ans,mem:S.mem,hist:S.hist}));}catch(e){}}

/* ---------- κόμβοι ---------- */
const FMAP={frac:["n","d"],mixed:["w","n","d"],pow:["b","e"],sqrt:["r"],root:["i","r"],paren:["b"],abs:["b"],int:["lo","hi","b"],der:["b","p"],sum:["lo","hi","b"],dms:["d","m","s"]};
const FN={sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,sinh:1,cosh:1,tanh:1,asinh:1,acosh:1,atanh:1,ln:1,log:1,logxy:2,nCr:2,nPr:2};
const fieldsOf=n=>n.t==="fn"?(FN[n.v]===2?["a","b"]:["a"]):FMAP[n.t];
function slot(node,field,parent){const a=[];a.meta={node,field,parent};return a;}
function mk(t,v){
  const n={t};if(v!==undefined)n.v=v;
  const fs=t==="fn"?(FN[v]===2?["a","b"]:["a"]):FMAP[t];
  if(fs){n.f={};for(const f of fs)n.f[f]=slot(n,f,null);}
  return n;
}
function attach(n,arr){if(n.f)for(const f in n.f)n.f[f].meta.parent=arr;return n;}
function linkTree(arr,parent){arr.meta=parent?{node:parent.node,field:parent.field,parent:parent.parent}:null;
  for(const n of arr)if(n.f)for(const f in n.f)linkTree(n.f[f],{node:n,field:f,parent:arr});}
const num=v=>({t:"num",v:String(v),neg:false});
const konst=v=>({t:"const",v});
const isOperand=n=>n&&n.t!=="op";

/* ---------- δρομέας ---------- */
function right(){
  const c=S.cur,n=c.arr[c.i];
  if(n&&fieldsOf(n)){c.arr=n.f[fieldsOf(n)[0]];c.i=0;return;}
  if(c.i<c.arr.length){c.i++;return;}
  const m=c.arr.meta;if(!m)return;
  const fs=fieldsOf(m.node),k=fs.indexOf(m.field);
  if(k<fs.length-1){c.arr=m.node.f[fs[k+1]];c.i=0;}
  else{c.arr=m.parent;c.i=m.parent.indexOf(m.node)+1;}
}
function left(){
  const c=S.cur;
  if(c.i>0){
    const n=c.arr[c.i-1];
    if(fieldsOf(n)){const fs=fieldsOf(n),l=n.f[fs[fs.length-1]];c.arr=l;c.i=l.length;}
    else c.i--;
    return;
  }
  const m=c.arr.meta;if(!m)return;
  const fs=fieldsOf(m.node),k=fs.indexOf(m.field);
  if(k>0){const p=m.node.f[fs[k-1]];c.arr=p;c.i=p.length;}
  else{c.arr=m.parent;c.i=m.parent.indexOf(m.node);}
}
function comma(){
  const m=S.cur.arr.meta;if(!m)return;
  const fs=fieldsOf(m.node),k=fs.indexOf(m.field);
  if(k<fs.length-1){S.cur={arr:m.node.f[fs[k+1]],i:0};}
  else{S.cur={arr:m.parent,i:m.parent.indexOf(m.node)+1};}
}
function beginEdit(kind){
  if(!S.fresh)return;
  S.fresh=false;
  if(kind==="op"){S.root=[attach(konst("Ans"),S.root)];S.root.meta=null;S.cur={arr:S.root,i:1};}
  else{S.root=[];S.root.meta=null;S.cur={arr:S.root,i:0};}
}
function ins(n,enterField){
  beginEdit("val");
  attach(n,S.cur.arr);
  S.cur.arr.splice(S.cur.i,0,n);S.cur.i++;
  if(enterField){S.cur={arr:n.f[enterField],i:0};}
  render();
}
function digit(d){
  beginEdit("val");
  const p=S.cur.arr[S.cur.i-1];
  if(p&&p.t==="num"&&p.v.length<16){p.v+=d;}
  else{const n=num(d);S.cur.arr.splice(S.cur.i,0,n);S.cur.i++;}
  render();
}
function dot(){
  beginEdit("val");
  const p=S.cur.arr[S.cur.i-1];
  if(p&&p.t==="num"){if(!p.v.includes("."))p.v+=".";}
  else{const n=num("0.");S.cur.arr.splice(S.cur.i,0,n);S.cur.i++;}
  render();
}
function op(v){
  beginEdit("op");
  const p=S.cur.arr[S.cur.i-1];
  if(p&&p.t==="op"){p.v=v;}
  else{S.cur.arr.splice(S.cur.i,0,{t:"op",v});S.cur.i++;}
  render();
}
function neg(){
  beginEdit("val");
  const p=S.cur.arr[S.cur.i-1];
  if(p&&p.t==="num"){p.neg=!p.neg;}
  else{const n=num("");n.neg=true;n.v="";S.cur.arr.splice(S.cur.i,0,n);S.cur.i++;}
  render();
}
function powKey(exp){
  beginEdit("val");
  const c=S.cur,p=c.arr[c.i-1];
  const n=mk("pow");
  if(p&&isOperand(p)){
    c.arr[c.i-1]=n;
    n.f.b=[p];n.f.b.meta={node:n,field:"b",parent:c.arr};
    if(exp!==undefined){n.f.e=[num(exp)];}
    c.arr=n.f.e;c.i=n.f.e.length;
  }else{
    if(exp!==undefined)n.f.e=[num(exp)];
    attach(n,c.arr);c.arr.splice(c.i,0,n);c.i++;
    c.arr=n.f.b;c.i=0;
  }
  render();
}
function backspace(){
  S.fresh=false;S.err=false;
  const c=S.cur;
  if(c.i>0){
    const p=c.arr[c.i-1];
    if(p.t==="num"){if(p.v.length>1)p.v=p.v.slice(0,-1);else{c.arr.splice(c.i-1,1);c.i--;}render();return;}
    if(fieldsOf(p)){
      const fs=fieldsOf(p),any=fs.some(f=>p.f[f].length);
      if(any){const l=p.f[fs[fs.length-1]];c.arr=l;c.i=l.length;}
      else{c.arr.splice(c.i-1,1);c.i--;}
      render();return;
    }
    c.arr.splice(c.i-1,1);c.i--;render();return;
  }
  const m=c.arr.meta;
  if(m){
    const pi=m.parent.indexOf(m.node);
    if(c.arr.length===0&&fsEmpty(m.node)){m.parent.splice(pi,1);S.cur={arr:m.parent,i:pi};}
    else S.cur={arr:m.parent,i:pi};
  }
  render();
}
function fsEmpty(n){return fieldsOf(n).every(f=>n.f[f].length===0);}

/* ---------- υπολογισμός ---------- */
const CV={c:299792458,h:6.62607015e-34,"ħ":1.054571817e-34,G:6.6743e-11,"qₑ":1.602176634e-19,"ε₀":8.8541878128e-12,"μ₀":1.25663706212e-6,"k_B":1.380649e-23,"N_A":6.02214076e23,"mₑ":9.1093837015e-31,"m_p":1.67262192369e-27,"m_n":1.67492749804e-27,R:8.314462618,"σ":5.670374419e-8,g:9.80665,atm:101325,u:1.6605390666e-27,"kₑ":8.9875517923e9,"α":7.2973525693e-3};
function fact(v){if(v<0||Math.abs(v-Math.round(v))>1e-9)throw 0;v=Math.round(v);if(v>170)return Infinity;let r=1;for(let i=2;i<=v;i++)r*=i;return r;}
function nCr(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n)throw 0;r=Math.min(r,n-r);let x=1;for(let i=1;i<=r;i++)x=x*(n-r+i)/i;return Math.round(x);}
function nPr(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n)throw 0;let x=1;for(let i=0;i<r;i++)x*=(n-i);return x;}
const angK=()=>D.angle==="DEG"?Math.PI/180:D.angle==="GRAD"?Math.PI/200:1;
const cl=v=>Math.abs(v)<1e-12?0:v;
function evArr(arr,env){
  if(!arr.length)throw 0;
  const tk=[];
  for(const n of arr){
    if(n.t==="op"){tk.push({op:n.v});continue;}
    if(n.t==="post"){
      const last=tk[tk.length-1];
      if(!last||last.op)throw 0;
      last.post=n.v;continue;
    }
    const last=tk[tk.length-1];
    if(last&&!last.op)tk.push({op:"×"});
    tk.push({node:n});
  }
  let p=0;
  const prec=o=>(o==="+"||o==="−")?1:2;
  function atom(){
    const t=tk[p];
    if(!t)throw 0;
    if(t.op){
      if(t.op==="−"||t.op==="+"){p++;const v=atom();return t.op==="−"?-v:v;}
      throw 0;
    }
    p++;let v=evNode(t.node,env);
    if(t.post==="!")v=fact(v);
    if(t.post==="%")v=v/100;
    return v;
  }
  function expr(min){
    let l=atom();
    while(tk[p]&&tk[p].op&&prec(tk[p].op)>=min){
      const o=tk[p++].op,r=expr(prec(o)+1);
      l=o==="+"?l+r:o==="−"?l-r:o==="×"?l*r:o==="÷"?l/r:l%r;
    }
    return l;
  }
  const v=expr(1);
  if(p!==tk.length)throw 0;
  return v;
}
function evNode(n,env){
  env=env||{};
  const E=a=>evArr(a,env);
  switch(n.t){
    case"num":{const v=parseFloat(n.v);if(Number.isNaN(v))throw 0;return n.neg?-v:v;}
    case"const":
      if(n.v==="π")return Math.PI;
      if(n.v==="e")return Math.E;
      if(n.v==="∞")return Infinity;
      if(n.v==="Ans")return S.ans;
      if(n.v==="M")return S.mem;
      if(n.v==="X")return env.X!==undefined?env.X:throw0();
      if(n.v==="Y")return env.Y!==undefined?env.Y:throw0();
      if(CV[n.v]!==undefined)return CV[n.v];
      throw 0;
    case"frac":return E(n.f.n)/E(n.f.d);
    case"mixed":{const w=n.f.w.length?E(n.f.w):0;return w+E(n.f.n)/E(n.f.d);}
    case"pow":return Math.pow(E(n.f.b),E(n.f.e));
    case"sqrt":return Math.sqrt(E(n.f.r));
    case"root":{const i=E(n.f.i),y=E(n.f.r);if(y<0&&Number.isInteger(i)&&i%2!==0)return -Math.pow(-y,1/i);return Math.pow(y,1/i);}
    case"paren":return E(n.f.b);
    case"abs":return Math.abs(E(n.f.b));
    case"dms":{const d=n.f.d.length?E(n.f.d):0,m=n.f.m.length?E(n.f.m):0,s=n.f.s.length?E(n.f.s):0;const sg=d<0?-1:1;return d+sg*(m/60+s/3600);}
    case"fn":{
      const a=E(n.f.a),b=n.f.b?E(n.f.b):0,k=angK();
      switch(n.v){
        case"sin":return cl(Math.sin(a*k));case"cos":return cl(Math.cos(a*k));
        case"tan":{const r=Math.tan(a*k);return Math.abs(r)>1e15?(r>0?Infinity:-Infinity):cl(r);}
        case"asin":return cl(Math.asin(a)/k);case"acos":return Math.acos(a)/k;case"atan":return cl(Math.atan(a)/k);
        case"sinh":return Math.sinh(a);case"cosh":return Math.cosh(a);case"tanh":return Math.tanh(a);
        case"asinh":return Math.asinh(a);case"acosh":return Math.acosh(a);case"atanh":return Math.atanh(a);
        case"ln":return Math.log(a);case"log":return Math.log10(a);
        case"logxy":return Math.log(b)/Math.log(a);
        case"nCr":return nCr(a,b);case"nPr":return nPr(a,b);
      }
      throw 0;
    }
    case"der":{
      const c=E(n.f.p),h=1e-5*Math.max(1,Math.abs(c));
      return (evArr(n.f.b,Object.assign({},env,{X:c+h}))-evArr(n.f.b,Object.assign({},env,{X:c-h})))/(2*h);
    }
    case"int":{
      const lo=E(n.f.lo),hi=E(n.f.hi);
      const f=x=>evArr(n.f.b,Object.assign({},env,{X:x}));
      return integ(lo,hi,f);
    }
    case"sum":{
      const st=Math.round(E(n.f.lo)),en=E(n.f.hi);
      const prod=n.v==="Π";let acc=prod?1:0;
      if(en===Infinity){
        for(let k=st;k<st+200000;k++){
          const t=evArr(n.f.b,Object.assign({},env,{X:k}));
          if(prod){acc*=t;if(Math.abs(t-1)<1e-13)break;}
          else{acc+=t;if(Math.abs(t)<1e-13)break;}
        }
        return acc;
      }
      for(let k=st;k<=Math.round(en);k++){
        const t=evArr(n.f.b,Object.assign({},env,{X:k}));
        acc=prod?acc*t:acc+t;
      }
      return acc;
    }
  }
  throw 0;
}
function throw0(){throw 0;}
function simpson(f,a,b,n){const h=(b-a)/n;let s=f(a)+f(b);for(let i=1;i<n;i++)s+=f(a+i*h)*(i%2?4:2);return s*h/3;}
function integ(lo,hi,f){
  if(lo===hi)return 0;
  if(lo===Infinity||hi===-Infinity)return -integ(hi===-Infinity?lo:hi,lo===Infinity?hi:lo,x=>f(-x))*-1;
  if(lo===-Infinity&&hi===Infinity)return integ(-Infinity,0,f)+integ(0,Infinity,f);
  if(hi===Infinity){const g=t=>f(lo+t/(1-t))/((1-t)*(1-t));return simpson(g,0,1-1e-6,2000);}
  if(lo===-Infinity){const g=t=>f(hi-t/(1-t))/((1-t)*(1-t));return simpson(g,0,1-1e-6,2000);}
  return simpson(f,lo,hi,1000);
}
function live(){try{const v=evArr(S.root,{});return typeof v==="number"&&!Number.isNaN(v)?v:null;}catch(e){return null;}}

/* ---------- μορφή αποτελέσματος ---------- */
function strip(s){return s.includes(".")?s.replace(/0+$/,"").replace(/\.$/,""):s;}
function sciStr(v,p){let[m,ex]=v.toExponential(p-1).split("e");m=strip(m);return m+"E"+(ex.startsWith("-")?"−":"+")+Math.abs(parseInt(ex));}
function engStr(v,p){if(v===0)return"0";const e3=Math.floor(Math.log10(Math.abs(v))/3)*3;const m=v/Math.pow(10,e3);return strip(m.toPrecision(p))+"E"+(e3<0?"−":"+")+Math.abs(e3);}
function autoStr(v,p){const a=Math.abs(v);if(v!==0&&(a>=1e12||a<1e-6))return sciStr(v,p);return strip(String(parseFloat(v.toPrecision(p)))).replace("-","−");}
function toFrac(v){
  const sg=v<0?-1:1,x=Math.abs(v);
  let h1=1,h2=0,k1=0,k2=1,b=x;
  for(let i=0;i<40;i++){
    const a=Math.floor(b),h=a*h1+h2,k=a*k1+k2;
    if(k>10000)break;
    if(Math.abs(x-h/k)<1e-9*Math.max(1,x))return{n:sg*h,d:k};
    h2=h1;h1=h;k2=k1;k1=k;
    const f=b-a;if(f<1e-12)break;b=1/f;
  }
  return null;
}
function dmsStr(v){
  const sg=v<0?"−":"",a=Math.abs(v);
  let d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d)*60-m)*60;
  s=Math.round(s*100)/100;
  if(s>=60){s-=60;m++;}if(m>=60){m-=60;d++;}
  return sg+d+"° "+m+"′ "+s+"″";
}
function baseStr(v){
  if(!Number.isInteger(v)||Math.abs(v)>2**53)return null;
  const b=D.base==="BIN"?2:D.base==="OCT"?8:16;
  return (v<0?"−":"")+Math.abs(v).toString(b).toUpperCase();
}

function resultContent(v){
  resEl.innerHTML="";resEl.classList.remove("err");
  if(v===null){resEl.textContent=S.root.length?"":"0";return;}
  if(D.base!=="DEC"){const b=baseStr(v);if(b){resEl.textContent=b;return;}}
  if(D.dms){resEl.textContent=dmsStr(v);return;}
  if(D.sd>0&&isFinite(v)){
    const f=toFrac(v);
    if(f){
      if(D.sd===2&&Math.abs(f.n)>f.d&&f.d>1){
        const sg=f.n<0?-1:1,w=Math.floor(Math.abs(f.n)/f.d),rn=Math.abs(f.n)-w*f.d;
        const mx=mk("mixed");
        mx.f.w=[num(sg*w)];mx.f.n=[num(rn)];mx.f.d=[num(f.d)];
        resEl.appendChild(renderNode(mx));return;
      }
      if(f.d===1){resEl.textContent=String(f.n).replace("-","−");return;}
      const fr=mk("frac");fr.f.n=[num(f.n<0?"−"+Math.abs(f.n):f.n)];fr.f.d=[num(f.d)];
      if(f.n<0){fr.f.n=[num(Math.abs(f.n))];resEl.appendChild(txt("−"));}
      resEl.appendChild(renderNode(fr));return;
    }
  }
  if(!isFinite(v)){resEl.textContent=v>0?"∞":"−∞";return;}
  resEl.textContent=D.fmt==="SCI"?sciStr(v,D.prec):D.fmt==="ENG"?engStr(v,D.prec):autoStr(v,D.prec);
}

  indEl.textContent="∠ "+D.angle+(D.fmt!=="AUTO"?"  "+D.fmt:"")+(D.base!=="DEC"?"  "+D.base:"")+(D.sd?"  S⇔D":"")+(D.dms?"  DMS":"")+(S.hyp?"  HYP":"")+(S.shift?"  SHIFT":"")+(S.mem!==0?"  M":"");

  if(S.err){resEl.innerHTML="";resEl.textContent="Σφάλμα";resEl.classList.add("err");}
  else resultContent(live());
  sndIcon();
}

let AC=null;
function beep(f,d,g,type){
  if(!D.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||"square";o.frequency.value=f;
    gn.gain.setValueAtTime(g,AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(1e-4,AC.currentTime+d);
    o.connect(gn);gn.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

const eqSnd=()=>{beep(880,.09,.05,"sine");setTimeout(()=>beep(1320,.12,.05,"sine"),70);};

/* ---------- πλήκτρα ---------- */
function trigName(base){return (S.shift?"a":"")+base+(S.hyp?"h":"");}
function doKey(k){
  S.err=false;
  if(k.a==="shift"){S.shift=!S.shift;render();return;}
  const sh=S.shift;S.shift=false;
  vib();clickSnd();
  if(k.t==="trig"){const nm=trigName(k.base);S.hyp=false;ins(mk("fn",nm),"a");return;}
  if(k.i!==undefined&&!k.a){
    const v=sh&&k.si!==undefined?k.si:k.i;
    applyIns(v);return;
  }
  act(sh&&k.sa?k.sa:k.a);
}
function applyIns(v){
  if(typeof v==="string"){
    if(/^[0-9]$/.test(v))return digit(v);
    if(v===".")return dot();
    if(["+","−","×","÷","mod"].includes(v))return op(v);
    if(v==="!")return ins({t:"post",v:"!"});
    if(v==="%")return ins({t:"post",v:"%"});
    if(v==="π"||v==="e"||v==="∞"||v==="Ans"||v==="M"||v==="X"||v==="Y")return ins(konst(v));
    if(v==="(")return ins(mk("paren"),"b");
    if(v==="abs")return ins(mk("abs"),"b");
    if(v==="frac")return ins(mk("frac"),"n");
    if(v==="mixed")return ins(mk("mixed"),"w");
    if(v==="sqrt")return ins(mk("sqrt"),"r");
    if(v==="cbrt"){const n=mk("root");n.f.i=[num(3)];return ins(n,"r");}
    if(v==="nroot")return ins(mk("root"),"i");
    if(v==="pow")return powKey();
    if(v==="pow2")return powKey("2");
    if(v==="pow3")return powKey("3");
    if(v==="inv")return powKey("-1");
    if(v==="e^")return ins(mk("fn","ln"),"a"),powWrapE();
    if(v==="10^")return powWrapE(10);
    if(v==="exp10"){op("×");const n=mk("pow");n.f.b=[num(10)];attach(n,S.cur.arr);S.cur.arr.splice(S.cur.i,0,n);S.cur.i++;S.cur={arr:n.f.e,i:0};render();return;}
    if(v==="int")return ins(mk("int"),"lo");
    if(v==="der")return ins(mk("der"),"b");
    if(v==="sum")return ins(mk("sum","Σ"),"lo");
    if(v==="prod")return ins(mk("sum","Π"),"lo");
    if(v==="dms")return ins(mk("dms"),"d");
    if(v==="ln"||v==="log"||v==="logxy"||v==="nCr"||v==="nPr")return ins(mk("fn",v),"a");
    return;
  }
}
function powWrapE(base){
  // eˣ / 10ˣ: αντικατάσταση της μόλις εισαγόμενης δομής από σωστή δύναμη
  const c=S.cur,arr=c.arr;
  const last=arr[c.i-1];
  if(last&&last.t==="fn"&&last.t!=="pow"){arr.splice(c.i-1,1);c.i--;}
  const n=mk("pow");
  n.f.b=[base?num(base):konst("e")];
  attach(n,arr);arr.splice(c.i,0,n);c.i++;
  S.cur={arr:n.f.e,i:0};render();
}
function act(a){
  let v;
  switch(a){
    case"left":S.fresh=false;left();render();break;
    case"right":S.fresh=false;right();render();break;
    case"comma":S.fresh=false;comma();render();break;
    case"del":backspace();break;
    case"ac":S.root=[];S.root.meta=null;S.cur={arr:S.root,i:0};S.fresh=false;S.hyp=false;render();break;
    case"neg":neg();break;
    case"drg":D.angle=D.angle==="DEG"?"RAD":D.angle==="RAD"?"GRAD":"DEG";save();render();break;
    case"hyp":S.hyp=!S.hyp;render();break;
    case"fse":D.fmt=D.fmt==="AUTO"?"SCI":D.fmt==="SCI"?"ENG":"AUTO";save();render();break;
    case"sd":D.sd=(D.sd+1)%3;save();render();break;
    case"bin":D.base=D.base==="BIN"?"DEC":"BIN";save();render();break;
    case"oct":D.base=D.base==="OCT"?"DEC":"OCT";save();render();break;
    case"hex":D.base=D.base==="HEX"?"DEC":"HEX";save();render();break;
    case"dec":D.base="DEC";save();render();break;
    case"dmsout":D.dms=!D.dms;save();render();break;
    case"mplus":v=live();if(v!==null&&isFinite(v)){S.mem+=v;save();}render();break;
    case"mminus":v=live();if(v!==null&&isFinite(v)){S.mem-=v;save();}render();break;
    case"mstore":v=live();if(v!==null&&isFinite(v)){S.mem=v;save();}render();break;
    case"mr":ins(konst("M"));break;
    case"ran":ins(num(Math.random().toFixed(6)));break;
    case"menu":openSheet("menu");break;
    case"cnst":openSheet("cnst");break;
    case"conv":openSheet("conv");break;
    case"hist":openSheet("hist");break;
    case"eq":eq(false);break;
  }
}
function eq(collapse){
  const v=live();
  if(v===null){S.err=true;errSnd();render();return;}
  S.ans=v;
  S.hist.unshift({tree:JSON.stringify(S.root,(k,x)=>k==="meta"?undefined:x),r:autoStr(v,D.prec),v});
  if(S.hist.length>40)S.hist.pop();
  save();eqSnd();
  if(collapse){
    const s=String(parseFloat(v.toPrecision(12)));
    const n=num(s.replace("-",""));n.neg=v<0;
    S.root=[n];S.root.meta=null;S.cur={arr:S.root,i:1};S.fresh=false;
  }else S.fresh=true;
  render();
}

function mkKeys(rows,host,dig){
  for(const row of rows)for(const k of row){
    const b=document.createElement("button");b.type="button";
    if(k.c)b.className=k.c;

      const end=()=>{clearTimeout(timer);b.classList.remove("holding");};

  }
}
mkKeys(SCI,document.getElementById("sci"),false);
mkKeys(DIG,document.getElementById("dig"),true);

/* ---------- φύλλα ---------- */
const sheet=document.getElementById("sheet"),pbody=document.getElementById("pbody"),ptitle=document.getElementById("ptitle");
document.getElementById("pclose").addEventListener("click",()=>sheet.hidden=true);
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.hidden=true;});
function row(label,ctrl){const r=el("div","row");const l=el("span");l.textContent=label;r.append(l,ctrl);return r;}
function select(opts,val,fn){const s=document.createElement("select");for(const o of opts){const op=document.createElement("option");op.value=o;op.textContent=o;if(o===val)op.selected=true;s.appendChild(op);}s.addEventListener("change",()=>{fn(s.value);save();render();});return s;}
function toggle(on,fn){const b=el("button","tgl"+(on?" on":""));b.type="button";b.addEventListener("click",()=>{fn(!b.classList.contains("on"));b.classList.toggle("on");save();render();});return b;}
const CNAMES={c:"Ταχύτητα φωτός",h:"Σταθερά Planck","ħ":"ħ = h/2π",G:"Σταθερά βαρύτητας","qₑ":"Φορτίο ηλεκτρονίου","ε₀":"Ηλεκτρική σταθερά","μ₀":"Μαγνητική σταθερά","k_B":"Σταθερά Boltzmann","N_A":"Αριθμός Avogadro","mₑ":"Μάζα ηλεκτρονίου","m_p":"Μάζα πρωτονίου","m_n":"Μάζα νετρονίου",R:"Παγκόσμια σταθερά αερίων","σ":"Σταθερά Stefan–Boltzmann",g:"Επιτάχυνση βαρύτητας",atm:"Ατμοσφαιρική πίεση",u:"Ατομική μονάδα μάζας","kₑ":"Σταθερά Coulomb","α":"Σταθερά λεπτής υφής"};
const CONV={
"Μήκος":{m:1,km:1000,cm:.01,mm:.001,"μm":1e-6,nm:1e-9,"Å":1e-10,mi:1609.344,ft:.3048,in:.0254},
"Μάζα":{kg:1,g:.001,mg:1e-6,t:1000,lb:.45359237,oz:.028349523125,u:1.6605390666e-27},
"Χρόνος":{s:1,min:60,h:3600,d:86400,yr:31557600,ms:.001},
"Ενέργεια":{J:1,kJ:1000,eV:1.602176634e-19,keV:1.602176634e-16,MeV:1.602176634e-13,cal:4.184,kcal:4184,kWh:3.6e6,erg:1e-7},
"Πίεση":{Pa:1,kPa:1000,bar:1e5,atm:101325,mmHg:133.322387415,psi:6894.757293168},
"Ταχύτητα":{"m/s":1,"km/h":1/3.6,mph:.44704,kn:.514444,c:299792458},
"Γωνία":{"°":Math.PI/180,rad:1,grad:Math.PI/200,"′":Math.PI/10800,"″":Math.PI/648000},
"Θερμοκρασία":{K:1,"°C":1,"°F":1}
};
function convCalc(cat,x,f,t){
  if(cat==="Θερμοκρασία"){
    let k=f==="K"?x:f==="°C"?x+273.15:(x-32)*5/9+273.15;
    return t==="K"?k:t==="°C"?k-273.15:(k-273.15)*9/5+32;
  }
  return x*CONV[cat][f]/CONV[cat][t];
}
function openSheet(kind){
  sheet.hidden=false;pbody.innerHTML="";
  if(kind==="menu"){
    ptitle.textContent="Ρυθμίσεις";
    pbody.append(
      row("Γωνία",select(["DEG","RAD","GRAD"],D.angle,v=>D.angle=v)),
      row("Μορφή",select(["AUTO","SCI","ENG"],D.fmt,v=>D.fmt=v)),
      row("Ακρίβεια",(()=>{const r=document.createElement("input");r.type="range";r.min=6;r.max=14;r.value=D.prec;const out=el("span");out.textContent=D.prec;r.addEventListener("input",()=>{D.prec=+r.value;out.textContent=r.value;save();render();});const w=el("span");w.style.display="flex";w.style.gap="8px";w.style.flex="1";w.append(r,out);return w;})()),
      row("Βάση",select(["DEC","BIN","OCT","HEX"],D.base,v=>D.base=v)),
      row("Κλάσμα (S⇔D)",select(["Όχι","Κλάσμα","Μικτό"],D.sd===0?"Όχι":D.sd===1?"Κλάσμα":"Μικτό",v=>D.sd=v==="Όχι"?0:v==="Κλάσμα"?1:2)),
      row("Ήχος",toggle(D.sound,v=>D.sound=v)),
      row("Δόνηση",toggle(D.vib,v=>D.vib=v)),
      row("Επαναφορά",(()=>{const b=el("button");b.type="button";b.textContent="Όλα προεπιλογή";b.style.padding="6px 12px";b.addEventListener("click",()=>{Object.assign(D,{angle:"DEG",fmt:"AUTO",sd:0,base:"DEC",dms:false,prec:10,sound:true,vib:true});save();render();openSheet("menu");});return b;})())
    );
  }
  if(kind==="cnst"){
    ptitle.textContent="Φυσικές σταθερές";
    for(const s in CV){
      const r=el("div","crow");
      const cs=el("span","cs");cs.textContent=s;
      const cn=el("span","cn");cn.textContent=CNAMES[s]||s;
      const cv=el("span","cv");cv.textContent=CV[s].toExponential(6).replace("e","·10^");
      r.append(cs,cn,cv);
      r.addEventListener("click",()=>{sheet.hidden=true;ins(konst(s));});
      pbody.appendChild(r);
    }
  }
  if(kind==="conv"){
    ptitle.textContent="Μετατροπή μονάδων";
    const cats=Object.keys(CONV);
    let cat=cats[0];
    const catSel=select(cats,cat,v=>{cat=v;fill();});
    const from=el("select"),to=el("select"),inp=document.createElement("input");
    inp.type="number";inp.value="1";inp.inputMode="decimal";
    const out=el("div","convout");
    function fill(){
      from.innerHTML="";to.innerHTML="";
      const us=Object.keys(CONV[cat]);
      for(const u of us){from.appendChild(new Option(u,u));to.appendChild(new Option(u,u));}
      to.selectedIndex=Math.min(1,us.length-1);calc();
    }
    function calc(){
      const x=parseFloat(inp.value);
      if(Number.isNaN(x)){out.textContent="—";return;}
      const r=convCalc(cat,x,from.value,to.value);
      out.textContent=autoStr(r,D.prec)+" "+to.value;
      out.dataset.v=String(parseFloat(r.toPrecision(12)));
    }
    inp.addEventListener("input",calc);from.addEventListener("change",calc);to.addEventListener("change",calc);
    pbody.append(row("Κατηγορία",catSel),row("Τιμή",inp),row("Από",from),row("Προς",to),out);
    const ib=el("button","insbtn");ib.type="button";ib.textContent="Εισαγωγή στο κομπιουτεράκι";
    ib.addEventListener("click",()=>{const v=parseFloat(out.dataset.v);if(!Number.isNaN(v)){sheet.hidden=true;const n=num(String(Math.abs(v)));n.neg=v<0;ins(n);}});
    pbody.appendChild(ib);fill();
  }
  if(kind==="hist"){
    ptitle.textContent="Ιστορικό";
    if(!S.hist.length){const d=el("div","row");d.textContent="Κενό";pbody.appendChild(d);}
    for(const h of S.hist){
      const r=el("div","hrow");
      const he=el("span","he");he.textContent=h.r;
      const hr=el("span","hr");hr.textContent=h.r;
      const b1=el("button");b1.type="button";b1.textContent="Τιμή";
      b1.addEventListener("click",()=>{sheet.hidden=true;const n=num(String(Math.abs(h.v)));n.neg=h.v<0;ins(n);});
      const b2=el("button");b2.type="button";b2.textContent="Πράξη";
      b2.addEventListener("click",()=>{
        sheet.hidden=true;
        try{
          const root=JSON.parse(h.tree);
          linkTree(root,null);
          S.root=root;S.cur={arr:root,i:root.length};S.fresh=false;render();
        }catch(e){}
      });
      r.append(he,b1,b2);pbody.appendChild(r);
    }
    const cb=el("button","insbtn");cb.type="button";cb.textContent="Διαγραφή ιστορικού";cb.style.background="#3a1420";cb.style.borderColor="#7f2330";
    cb.addEventListener("click",()=>{S.hist=[];save();openSheet("hist");});
    pbody.appendChild(cb);
  }
}

/* ---------- πληκτρολόγιο συσκευής ---------- */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(!sheet.hidden)return;
  const k=e.key;
  if(/^[0-9]$/.test(k))digit(k);
  else if(k===".")dot();
  else if(k==="+")op("+");
  else if(k==="-")op("−");
  else if(k==="*")op("×");
  else if(k==="/")op("÷");
  else if(k==="(")ins(mk("paren"),"b");
  else if(k==="Enter"||k==="=")eq(false);
  else if(k==="Backspace")backspace();
  else if(k==="ArrowLeft"){left();render();}
  else if(k==="ArrowRight"){right();render();}
  else if(k===",")comma(),render();
  else return;
  e.preventDefault();
});

render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
