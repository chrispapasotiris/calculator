<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<title>Κομπιουτεράκι</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============ ΘΕΜΑΤΑ ============ */
:root{
  --bg1:#05070f; --bg2:#0b1226;
  --glow1:rgba(124,92,255,.16); --glow2:rgba(0,229,255,.10);
  --key:rgba(255,255,255,.045); --keybr:rgba(255,255,255,.09);
  --keytx:#e8ecff; --dim:#8b93b8;
  --accent1:#7c5cff; --accent2:#00e5ff;
  --restx:#9fffe0; --danger:#ff5f7a;
  --disp:rgba(10,14,32,.62); --dispbr:rgba(124,92,255,.28);
  --chip:rgba(124,92,255,.14); --chipbr:rgba(124,92,255,.4);
  --sheet:rgba(9,12,28,.92); --shadow:rgba(0,0,0,.5);
  --bar:#2f6fd0;
}
body[data-theme="Ηφαίστειο"]{
  --bg1:#120604; --bg2:#241009;
  --glow1:rgba(255,107,53,.16); --glow2:rgba(255,209,102,.08);
  --key:rgba(255,235,220,.05); --keybr:rgba(255,150,90,.14);
  --keytx:#ffeede; --dim:#b08a76;
  --accent1:#ff6b35; --accent2:#ffd166;
  --restx:#ffd166; --danger:#ff4d6d;
  --disp:rgba(24,10,6,.66); --dispbr:rgba(255,107,53,.32);
  --chip:rgba(255,107,53,.14); --chipbr:rgba(255,107,53,.45);
  --sheet:rgba(20,8,5,.94); --shadow:rgba(0,0,0,.55);
  --bar:#ff8c5a;
}
body[data-theme="Πορσελάνη"]{
  --bg1:#f4f1ea; --bg2:#e6e0d2;
  --glow1:rgba(15,118,110,.10); --glow2:rgba(14,165,233,.08);
  --key:#ffffff; --keybr:#d8d2c2;
  --keytx:#1c2430; --dim:#7a8494;
  --accent1:#0f766e; --accent2:#0ea5e9;
  --restx:#0f766e; --danger:#dc2626;
  --disp:rgba(255,255,255,.72); --dispbr:rgba(15,118,110,.25);
  --chip:rgba(15,118,110,.10); --chipbr:rgba(15,118,110,.35);
  --sheet:rgba(250,248,242,.96); --shadow:rgba(60,50,30,.18);
  --bar:#0f766e;
}
/* ============ ΒΑΣΗ ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;color:var(--keytx);
  background:
    radial-gradient(60% 45% at 15% 0%,var(--glow1),transparent 70%),
    radial-gradient(55% 40% at 90% 100%,var(--glow2),transparent 70%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:background .5s,color .3s;
  padding-top:env(safe-area-inset-top);
}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
/* ============ ΠΑΝΩ ΜΠΑΡΑ ============ */
#bar{display:flex;align-items:center;gap:4px;padding:6px 10px 0}
.ibtn{
  width:30px;height:30px;flex:none;border:none;border-radius:10px;
  background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s,transform .1s;
}
.ibtn:active{transform:scale(.9);background:var(--chip);color:var(--accent2)}
.ibtn[disabled]{opacity:.3}
.ibtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#chips{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:10px;letter-spacing:.8px;padding:3px 8px;border-radius:20px;
  background:var(--chip);border:1px solid var(--chipbr);color:var(--accent2);
}
.chip.click{cursor:pointer}
/* ============ ΟΘΟΝΗ ============ */
#display{
  margin:8px 10px;flex:0 0 auto;height:25vh;min-height:148px;
  display:flex;flex-direction:column;border-radius:20px;
  background:var(--disp);border:1px solid var(--dispbr);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 34px var(--shadow);
  padding:8px 12px;transition:background .4s,border-color .4s;
}
#exprbox{flex:1;overflow:auto;padding:6px 2px;scrollbar-width:thin;scrollbar-color:var(--bar) transparent}
#exprbox::-webkit-scrollbar{width:7px;height:7px}
#exprbox::-webkit-scrollbar-track{background:transparent}
#exprbox::-webkit-scrollbar-thumb{background:var(--bar);border-radius:4px}
#expr{display:flex;min-width:100%}
#exprin{margin-left:auto;display:inline-flex;align-items:center;font-size:24px;padding:2px 4px}
#res{
  font-size:38px;font-weight:600;color:var(--restx);min-height:46px;line-height:46px;
  display:flex;justify-content:flex-end;align-items:center;gap:6px;
  overflow-x:auto;white-space:nowrap;scrollbar-width:none;letter-spacing:.5px;
}
#res::-webkit-scrollbar{display:none}
#res.err{color:var(--danger);font-size:20px;font-weight:500}
#res .hint{font-size:11px;color:var(--dim);font-weight:400}
/* ============ ΜΑΘΗΜΑΤΙΚΗ ΑΠΟΔΟΣΗ ============ */
.slot{display:inline-flex;align-items:center}
.empty{min-width:.7em;min-height:1.15em;border:1px dashed var(--dim);border-radius:4px;margin:0 2px;opacity:.6}
.caret{display:inline-block;width:2px;height:1.25em;background:var(--accent2);margin:0 1px;flex:none;animation:bl 1s steps(2) infinite;border-radius:1px}
@keyframes bl{50%{opacity:0}}
.n{display:inline-flex;align-items:center}
.op{margin:0 4px;color:var(--dim)}
.post{font-size:.8em;transform:translateY(-.3em)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.fr>.fn_{padding:1px 6px}
.fr>.fd{padding:1px 6px;border-top:2px solid var(--keytx)}
.mx{display:inline-flex;align-items:center;gap:2px}
.pw{display:inline-flex;align-items:baseline}
.pw>.pe{font-size:.66em;transform:translateY(-.55em);display:inline-flex;align-items:center}
.rd{display:inline-flex;align-items:stretch;margin:0 2px}
.rd svg{width:.55em;align-self:stretch;flex:none}
.rd>.rb{border-top:2px solid currentColor;padding:2px 5px 0;display:inline-flex;align-items:center}
.rd>.ri{font-size:.6em;align-self:flex-start;transform:translate(.35em,-.15em);margin-right:-.3em;display:inline-flex;align-items:center;z-index:1}
.pa{display:inline-flex;align-items:stretch;margin:0 2px}
.pa>.pl,.pa>.pr{width:.32em;border:2px solid var(--accent1);flex:none;opacity:.8}
.pa>.pl{border-right:none;border-radius:7px 0 0 7px}
.pa>.pr{border-left:none;border-radius:0 7px 7px 0}
.pa>.pb{display:inline-flex;align-items:center;padding:1px 3px}
.ab{display:inline-flex;align-items:stretch;margin:0 2px}
.ab>.bar{width:2px;background:var(--accent1);flex:none}
.ab>.pb{display:inline-flex;align-items:center;padding:1px 4px}
.fnn{color:var(--accent2);margin-right:1px}
.sub{font-size:.62em;transform:translateY(.35em);display:inline-flex;align-items:center}
.big{display:inline-flex;align-items:center;margin:0 2px}
.big>.sym{font-size:1.65em;line-height:1;color:var(--accent2)}
.big>.lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.6em;height:2.6em;margin:0 3px}
.big>.lims>span{display:inline-flex;align-items:center}
.dX{color:var(--dim);margin-left:3px;font-size:.85em}
.der{display:inline-flex;align-items:center}
.der>.df{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;margin-right:2px}
.der>.df>span:last-child{border-top:2px solid var(--keytx);padding:0 3px}
.der>.ev{border-left:2px solid var(--accent1);align-self:stretch;margin-left:2px}
/* ============ ΠΛΗΚΤΡΑ ============ */
#keys{flex:1;display:flex;flex-direction:column;gap:7px;padding:4px 10px calc(8px + env(safe-area-inset-bottom));min-height:0}
.sci{flex:1.22;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:7px}
.dig{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:7px}
.k{
  position:relative;overflow:hidden;border:1px solid var(--keybr);border-radius:14px;
  background:var(--key);color:var(--keytx);font-size:16px;padding:1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:0;
  box-shadow:0 2px 0 var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  transition:background .25s,border-color .25s,transform .08s,box-shadow .08s;
}
.k:active{transform:translateY(1px) scale(.97);box-shadow:0 0 0 var(--shadow)}
.k .sl{font-size:9px;line-height:9px;height:10px;color:var(--accent2);opacity:.85}
.dig .k{font-size:22px}
.k.fnk{font-size:12.5px;letter-spacing:.3px}
.k.red{color:var(--danger)}
.k.eq{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#04101c;font-weight:700;border:none;
  box-shadow:0 3px 14px var(--glow1),0 2px 0 var(--shadow);
}
body[data-theme="Πορσελάνη"] .k.eq{color:#fff}
.k.eq .hold{position:absolute;left:0;bottom:0;height:3px;width:0;background:rgba(255,255,255,.85)}
.k.eq.holding .hold{width:100%;transition:width .5s linear}
#shiftBtn.on{background:var(--chip);border-color:var(--accent2);color:var(--accent2)}
.ripple{position:absolute;border-radius:50%;background:var(--accent2);opacity:.25;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
body.nomotion .ripple{display:none}
body.nomotion *{animation:none!important;transition:none!important}
/* ============ ΦΥΛΛΑ / MODAL / TOAST ============ */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:30}
#panel{
  background:var(--sheet);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--dispbr);border-radius:24px 24px 0 0;
  max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -12px 40px var(--shadow);
}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:12.5px;padding:7px 13px;border-radius:20px;border:1px solid var(--keybr);background:transparent;color:var(--dim)}
.tab.on{background:var(--chip);border-color:var(--chipbr);color:var(--accent2)}
#phead{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;color:var(--dim);font-size:12px}
#pbody{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:var(--bar) transparent}
#pbody::-webkit-scrollbar{width:7px}
#pbody::-webkit-scrollbar-thumb{background:var(--bar);border-radius:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--keybr);font-size:14px}
.row select,.row input[type=number],.row input[type=text]{
  background:var(--key);color:var(--keytx);border:1px solid var(--keybr);border-radius:9px;padding:7px;font-size:14px;max-width:58%;
}
.row input[type=range]{flex:1;accent-color:var(--accent1)}
.tgl{width:46px;height:25px;border-radius:13px;background:var(--key);border:1px solid var(--keybr);position:relative;flex:none;padding:0;transition:background .2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:left .18s,background .18s}
.tgl.on{background:var(--chip)}
.tgl.on::after{left:23px;background:var(--accent2)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--keybr);font-size:14px}
.crow .cs{color:var(--restx);font-size:17px;min-width:46px}
.crow .cn{flex:1;color:var(--keytx)}
.crow .cv{color:var(--dim);font-size:11px}
.hrow{padding:9px 2px;border-bottom:1px solid var(--keybr);display:flex;align-items:center;gap:7px}
.hrow .ht{flex:1;min-width:0}
.hrow .he{color:var(--dim);font-size:11.5px;word-break:break-all}
.hrow .hr{color:var(--restx);font-size:16px;font-weight:600}
.hrow button{font-size:11.5px;padding:6px 9px;background:var(--key);border:1px solid var(--keybr);border-radius:8px;flex:none}
.bigbtn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--chipbr);background:var(--chip);color:var(--accent2);font-size:14.5px;margin-top:10px}
.bigbtn.warn{background:rgba(255,95,122,.12);border-color:var(--danger);color:var(--danger)}
.bigbtn.go{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#04101c;border:none;font-weight:700}
.convout{color:var(--restx);font-size:21px;text-align:right;padding:12px 2px;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:22px}
#mcard{background:var(--sheet);backdrop-filter:blur(18px);border:1px solid var(--dispbr);border-radius:22px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 60px var(--shadow)}
#mcard h3{margin:0 0 8px;font-size:17px;color:var(--accent2)}
#mcard p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:var(--keytx)}
#mcard ul{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--dim);line-height:1.6}
#mcard .mrow{display:flex;gap:9px;margin-top:6px}
#mcard .mrow button{flex:1;padding:11px;border-radius:12px;font-size:14px;border:1px solid var(--keybr);background:var(--key)}
#mcard .mrow button.go{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#04101c;border:none;font-weight:700}
#mcard label{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:12px}
#toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-70px);
  background:var(--sheet);border:1px solid var(--chipbr);color:var(--keytx);
  padding:10px 18px;border-radius:30px;font-size:13px;z-index:50;
  transition:transform .3s;box-shadow:0 8px 30px var(--shadow);max-width:88vw;text-align:center;
}
#toast.show{transform:translate(-50%,0)}
#gwrap{position:relative}
#gcanvas{width:100%;height:44vh;display:block;border-radius:14px;border:1px solid var(--keybr);background:var(--disp);touch-action:none}
#gtools{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
#gtools button{padding:8px 13px;border-radius:10px;border:1px solid var(--keybr);background:var(--key);font-size:13px}
#gread{margin-top:8px;font-size:13px;color:var(--restx);min-height:18px}
@media (orientation:landscape) and (max-height:520px){
  #display{height:32vh;min-height:110px}
  #res{font-size:26px;min-height:32px;line-height:32px}
  #exprin{font-size:18px}
  .k{font-size:12px;border-radius:10px}
  .dig .k{font-size:16px}
  .k .sl{font-size:7px;height:8px}
}
@media (max-height:680px) and (orientation:portrait){
  #res{font-size:30px}
  #exprin{font-size:20px}
  .k{font-size:13px}
  .dig .k{font-size:18px}
}
</style>
</head>
<body data-theme="Διάστημα">
<div id="bar">
  <button class="ibtn" id="ubtn" title="Αναίρεση"></button>
  <button class="ibtn" id="rbtn" title="Επανάληψη"></button>
  <div id="chips"></div>
  <button class="ibtn" id="tbtn" title="Θέμα"></button>
  <button class="ibtn" id="gbtn" title="Γράφημα"></button>
  <button class="ibtn" id="hbtn" title="Ιστορικό"></button>
  <button class="ibtn" id="updbtn" title="Έλεγχος ενημέρωσης"></button>
  <button class="ibtn" id="sndbtn" title="Ήχος"></button>
</div>
<div id="display">
  <div id="exprbox"><div id="expr"><div id="exprin"></div></div></div>
  <div id="res">0</div>
</div>
<div id="keys">
  <div class="sci" id="sci"></div>
  <div class="dig" id="dig"></div>
</div>
<div id="sheet" hidden>
  <div id="panel">
    <div id="tabs"></div>
    <div id="phead"><span id="ptitle"></span><button class="ibtn" id="pclose"></button></div>
    <div id="pbody"></div>
  </div>
</div>
<div id="modal" hidden><div id="mcard"></div></div>
<div id="toast"></div>
<script>
"use strict";
const APP_VERSION = "3.0.0";

/* ================= ΚΑΤΑΣΤΑΣΗ ================= */
const D = {
  theme:"Διάστημα", angle:"DEG", fmt:"AUTO", sd:0, base:"DEC",
  dms:false, prec:10, group:true, sound:true, vib:true, motion:true
};
const S = {
  root:[], cur:null, shift:false, hyp:false, fresh:false,
  err:false, errMsg:"", ans:0, mem:0, hist:[]
};
S.root.meta = null;
S.cur = {arr:S.root, i:0};
let lastErr = "";
const undoStack = [], redoStack = [];

try{
  const d = JSON.parse(localStorage.getItem("sciCalc3"));
  if(d){
    Object.assign(D, d.D||{});
    S.ans = d.ans||0; S.mem = d.mem||0; S.hist = d.hist||[];
  }
}catch(e){}
function save(){
  try{
    localStorage.setItem("sciCalc3", JSON.stringify({D, ans:S.ans, mem:S.mem, hist:S.hist}));
  }catch(e){}
}

/* ================= ΒΟΗΘΗΤΙΚΑ ================= */
function el(tag, cls){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  return e;
}
function txt(s){ return document.createTextNode(s); }
function debounce(fn, ms){
  let t;
  return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
}
const E_EMPTY = "Κενό πεδίο";
const E_DOM   = "Εκτός πεδίου ορισμού";
const E_SYN   = "Μη έγκυρη πράξη";
const E_VAR   = "Το X ορίζεται μόνο μέσα σε ∫, d/dx, Σ, Π";

/* ================= ΕΙΚΟΝΙΔΙΑ ================= */
const IC = {
  undo:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  redo:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>',
  palette:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="9" r="1.3" fill="currentColor"/><circle cx="15.5" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/><path d="M12 21a3 3 0 0 0 0-6h2a4 4 0 0 0 4-4"/></svg>',
  graph:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M7 15c3-8 5 4 10-6"/></svg>',
  clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  down:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>',
  sndOn:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',

let AC = null;
function beep(f, d, g, type){
  if(!D.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type||"square";
    o.frequency.value = f;
    gn.gain.setValueAtTime(g, AC.currentTime);
    gn.gain.exponentialRampToValueAtTime(1e-4, AC.currentTime + d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  }catch(e){}
}
const clickSnd = ()=>beep(1500, .04, .03);

function ripple(btn, ev){
  if(!D.motion) return;
  const r = btn.getBoundingClientRect();
  const s = el("span","ripple");
  const size = Math.max(r.width, r.height);
  s.style.width = s.style.height = size+"px";
  const x = (ev.clientX||r.left+r.width/2) - r.left - size/2;
  const y = (ev.clientY||r.top+r.height/2) - r.top - size/2;
  s.style.left = x+"px"; s.style.top = y+"px";
  btn.appendChild(s);
  s.addEventListener("animationend", ()=>s.remove());
}

/* ================= ΜΟΝΤΕΛΟ ΚΟΜΒΩΝ ================= */
const FMAP = {
  frac:["n","d"], mixed:["w","n","d"], pow:["b","e"],
  sqrt:["r"], root:["i","r"], paren:["b"], abs:["b"],
  int:["lo","hi","b"], der:["b","p"], sum:["lo","hi","b"], dms:["d","m","s"]
};
const FN = {
  sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,
  sinh:1,cosh:1,tanh:1,asinh:1,acosh:1,atanh:1,
  ln:1,log:1,logxy:2,nCr:2,nPr:2
};
function fieldsOf(n){
  if(n.t === "fn") return FN[n.v] === 2 ? ["a","b"] : ["a"];
  return FMAP[n.t];
}
function slot(node, field, parent){
  const a = [];
  a.meta = {node, field, parent};
  return a;
}
function mk(t, v){
  const n = {t};
  if(v !== undefined) n.v = v;
  const fs = fieldsOf(n);
  if(fs){
    n.f = {};
    for(const f of fs) n.f[f] = slot(n, f, null);
  }
  return n;
}
function attach(n, arr){
  if(n.f) for(const f in n.f) n.f[f].meta.parent = arr;
  return n;
}
function linkTree(arr, parent){
  arr.meta = parent ? {node:parent.node, field:parent.field, parent:parent.parent} : null;
  for(const n of arr)
    if(n.f) for(const f in n.f)
      linkTree(n.f[f], {node:n, field:f, parent:arr});
}
const num = v=>({t:"num", v:String(v), neg:false});
const konst = v=>({t:"const", v});
const isOperand = n=>n && n.t !== "op";

/* ================= ΔΡΟΜΕΑΣ ================= */
function right(){
  const c = S.cur, n = c.arr[c.i];
  if(n && fieldsOf(n)){ c.arr = n.f[fieldsOf(n)[0]]; c.i = 0; return; }
  if(c.i < c.arr.length){ c.i++; return; }
  const m = c.arr.meta;
  if(!m) return;
  const fs = fieldsOf(m.node), k = fs.indexOf(m.field);
  if(k < fs.length-1){ c.arr = m.node.f[fs[k+1]]; c.i = 0; }
  else { c.arr = m.parent; c.i = m.parent.indexOf(m.node)+1; }
}
function left(){
  const c = S.cur;
  if(c.i > 0){
    const n = c.arr[c.i-1];
    if(fieldsOf(n)){
      const fs = fieldsOf(n), l = n.f[fs[fs.length-1]];
      c.arr = l; c.i = l.length;
    } else c.i--;
    return;
  }
  const m = c.arr.meta;
  if(!m) return;
  const fs = fieldsOf(m.node), k = fs.indexOf(m.field);
  if(k > 0){ const p = m.node.f[fs[k-1]]; c.arr = p; c.i = p.length; }
  else { c.arr = m.parent; c.i = m.parent.indexOf(m.node); }
}
function comma(){
  const m = S.cur.arr.meta;
  if(!m) return;
  const fs = fieldsOf(m.node), k = fs.indexOf(m.field);
  if(k < fs.length-1){ S.cur = {arr:m.node.f[fs[k+1]], i:0}; }
  else { S.cur = {arr:m.parent, i:m.parent.indexOf(m.node)+1}; }
}
function beginEdit(kind){
  if(!S.fresh) return;

  if(kind === "op"){
    S.root = [konst("Ans")];
    S.root.meta = null;

/* ================= UNDO / REDO / AUTOSAVE ================= */
const serialize = ()=>JSON.stringify(S.root, (k,x)=>k==="meta"?undefined:x);
function deserialize(json){
  const arr = JSON.parse(json);
  linkTree(arr, null);
  return arr;
}
function curPath(){
  const steps = [];
  let a = S.cur.arr;
  while(a.meta){
    const m = a.meta;
    steps.unshift([m.parent.indexOf(m.node), m.field]);
    a = m.parent;
  }
  return steps;
}
function setCurPath(steps, i){
  let a = S.root;
  for(const [idx,f] of steps){
    if(!a[idx] || !a[idx].f) break;
    a = a[idx].f[f];
  }
  S.cur = {arr:a, i:Math.min(i, a.length)};
}
const snapshot = ()=>({t:serialize(), p:curPath(), i:S.cur.i});
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  undoBtns();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  const s = undoStack.pop();
  S.root = deserialize(s.t);
  setCurPath(s.p, s.i);
  S.fresh = false; S.err = false;
  render(); undoBtns(); vib();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  const s = redoStack.pop();
  S.root = deserialize(s.t);
  setCurPath(s.p, s.i);
  S.fresh = false; S.err = false;
  render(); undoBtns(); vib();
}
function undoBtns(){

}

/* ================= ΥΠΟΛΟΓΙΣΜΟΣ ================= */
const CV = {
  c:299792458, h:6.62607015e-34, "ħ":1.054571817e-34, G:6.6743e-11,
  "qₑ":1.602176634e-19, "ε₀":8.8541878128e-12, "μ₀":1.25663706212e-6,
  "k_B":1.380649e-23, "N_A":6.02214076e23, "mₑ":9.1093837015e-31,
  "m_p":1.67262192369e-27, "m_n":1.67492749804e-27, R:8.314462618,
  "σ":5.670374419e-8, g:9.80665, atm:101325, u:1.6605390666e-27,
  "kₑ":8.9875517923e9, "α":7.2973525693e-3, "Φ₀":2.067833848e-15,
  "R_K":25812.80745, "K_J":483597.8484e9, "μ_B":9.2740100783e-24,
  "μ_N":5.0507837461e-27, "rₑ":2.8179403262e-15, "a₀":5.29177210903e-11,
  "E_h":4.3597447222e-18, "R∞":10973731.56816, "F":96485.33212,
  "V_m":0.02271095464, "k":1.380649e-23
};
function fact(v){
  if(v < 0 || Math.abs(v-Math.round(v)) > 1e-9) throw E_DOM;
  v = Math.round(v);
  if(v > 170) return Infinity;
  let r = 1;
  for(let i=2;i<=v;i++) r *= i;
  return r;
}
function nCr(n,r){
  if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n) throw E_DOM;
  r = Math.min(r, n-r);
  let x = 1;
  for(let i=1;i<=r;i++) x = x*(n-r+i)/i;
  return Math.round(x);
}
function nPr(n,r){
  if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n) throw E_DOM;
  let x = 1;
  for(let i=0;i<r;i++) x *= (n-i);
  return x;
}
const angK = ()=>D.angle==="DEG"?Math.PI/180:D.angle==="GRAD"?Math.PI/200:1;
const cl = v=>Math.abs(v) < 1e-12 ? 0 : v;

function evArr(arr, env){
  if(!arr.length) throw E_EMPTY;
  const tk = [];
  for(const n of arr){
    if(n.t === "op"){ tk.push({op:n.v}); continue; }
    if(n.t === "post"){
      const last = tk[tk.length-1];
      if(!last || last.op) throw E_SYN;
      last.posts = last.posts||[];
      last.posts.push(n.v);
      continue;
    }
    const last = tk[tk.length-1];
    if(last && !last.op) tk.push({op:"×"});
    tk.push({node:n});

  let p = 0;
  const prec = o=>(o==="+"||o==="−")?1:2;

      if(t.op==="−"||t.op==="+"){ p++; const v = atom(); return t.op==="−"?-v:v; }
      throw E_SYN;

    p++;
    let v = evNode(t.node, env);
    if(t.posts) for(const po of t.posts){
      if(po === "!") v = fact(v);
      else v = v/100;
    }
    return v;
  }
  function expr(min){
    let l = atom();
    while(tk[p] && tk[p].op && prec(tk[p].op) >= min){
      const o = tk[p++].op, r = expr(prec(o)+1);
      l = o==="+"?l+r : o==="−"?l-r : o==="×"?l*r : o==="÷"?l/r : l%r;
    }
    return l;
  }
  const v = expr(1);
  if(p !== tk.length) throw E_SYN;
  return v;
}
function evNode(n, env){
  env = env||{};
  const E = a=>evArr(a, env);
  switch(n.t){
    case "num":{
      const v = parseFloat(n.v);
      if(Number.isNaN(v)) throw E_SYN;
      return n.neg ? -v : v;
    }
    case "const":
      if(n.v === "π") return Math.PI;
      if(n.v === "e") return Math.E;
      if(n.v === "∞") return Infinity;
      if(n.v === "Ans") return S.ans;
      if(n.v === "M") return S.mem;
      if(n.v === "X"){ if(env.X === undefined) throw E_VAR; return env.X; }
      if(n.v === "Y"){ if(env.Y === undefined) throw E_VAR; return env.Y; }
      if(CV[n.v] !== undefined) return CV[n.v];
      throw E_SYN;
    case "frac": return E(n.f.n)/E(n.f.d);
    case "mixed":{
      const w = n.f.w.length ? E(n.f.w) : 0;
      return w + E(n.f.n)/E(n.f.d);
    }
    case "pow": return Math.pow(E(n.f.b), E(n.f.e));
    case "sqrt":{

    }
    case "root":{

    }
    case "paren": return E(n.f.b);
    case "abs": return Math.abs(E(n.f.b));
    case "dms":{
      const d = n.f.d.length?E(n.f.d):0;
      const m = n.f.m.length?E(n.f.m):0;
      const s = n.f.s.length?E(n.f.s):0;
      const sg = d < 0 ? -1 : 1;
      return d + sg*(m/60 + s/3600);
    }
    case "fn":{
      const a = E(n.f.a), b = n.f.b?E(n.f.b):0, k = angK();
      let r;
      switch(n.v){
        case "sin": r = cl(Math.sin(a*k)); break;
        case "cos": r = cl(Math.cos(a*k)); break;
        case "tan":{

        case "asin": r = cl(Math.asin(a)/k); break;

        case "cosh": r = Math.cosh(a); break;
        case "tanh": r = Math.tanh(a); break;
        case "asinh": r = Math.asinh(a); break;
        case "acosh": r = Math.acosh(a); break;
        case "atanh": r = Math.atanh(a); break;
        case "ln": r = Math.log(a); break;

    return integ(-Infinity,0,f) + integ(0,Infinity,f);
  if(hi === Infinity){
    const g = t=>f(lo + t/(1-t))/((1-t)*(1-t));
    return simpson(g, 0, 1-1e-7, 2000);
  }
  if(lo === -Infinity){
    const g = t=>f(hi - t/(1-t))/((1-t)*(1-t));
    return simpson(g, 0, 1-1e-7, 2000);
  }
  return simpson(f, lo, hi, 1000);
}

function strip(s){
  return s.includes(".") ? s.replace(/0+$/,"").replace(/\.$/,"") : s;
}
function group(s){
  if(!D.group) return s;
  const parts = s.split("E");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return parts.join("E");
}
function sciStr(v,p){
  if(!isFinite(v)) return v>0?"∞":"−∞";
  let [m,ex] = v.toExponential(p-1).split("e");
  m = strip(m);
  return m+"E"+(ex.startsWith("-")?"−":"+")+Math.abs(parseInt(ex));
}
function engStr(v,p){
  if(!isFinite(v)) return v>0?"∞":"−∞";
  if(v === 0) return "0";
  const e3 = Math.floor(Math.log10(Math.abs(v))/3)*3;
  const m = v/Math.pow(10,e3);
  return strip(m.toPrecision(p))+"E"+(e3<0?"−":"+")+Math.abs(e3);
}
function autoStr(v,p){
  if(Number.isNaN(v)) return "Σφάλμα";
  if(!isFinite(v)) return v>0?"∞":"−∞";
  const a = Math.abs(v);
  if(v !== 0 && (a >= 1e12 || a < 1e-6)) return sciStr(v,p);
  return group(strip(String(parseFloat(v.toPrecision(p)))).replace("-","−"));
}
function toFrac(v){
  const sg = v<0?-1:1, x = Math.abs(v);
  let h1=1,h2=0,k1=0,k2=1,b=x;
  for(let i=0;i<40;i++){
    const a = Math.floor(b), h = a*h1+h2, k = a*k1+k2;
    if(k > 10000) break;
    if(Math.abs(x-h/k) < 1e-9*Math.max(1,x)) return {n:sg*h, d:k};
    h2=h1; h1=h; k2=k1; k1=k;
    const f = b-a;
    if(f < 1e-12) break;
    b = 1/f;
  }
  return null;
}
function dmsStr(v){
  const sg = v<0?"−":"", a = Math.abs(v);
  let d = Math.floor(a), m = Math.floor((a-d)*60), s = ((a-d)*60-m)*60;
  s = Math.round(s*100)/100;
  if(s >= 60){ s -= 60; m++; }
  if(m >= 60){ m -= 60; d++; }
  return sg+d+"° "+m+"′ "+s+"″";
}
function baseStr(v){
  if(!Number.isInteger(v) || Math.abs(v) > 2**53) return null;
  const b = D.base==="BIN"?2:D.base==="OCT"?8:16;
  return (v<0?"−":"")+Math.abs(v).toString(b).toUpperCase();
}
function treeToText(arr){
  return arr.map(n=>{
    const T = a=>treeToText(a);
    switch(n.t){
      case "num": return (n.neg?"-":"")+n.v;
      case "const": return n.v;
      case "op": return " "+n.v+" ";
      case "post": return n.v;
      case "frac": return "("+T(n.f.n)+"/"+T(n.f.d)+")";
      case "mixed": return T(n.f.w)+" "+T(n.f.n)+"/"+T(n.f.d);
      case "pow": return T(n.f.b)+"^("+T(n.f.e)+")";
      case "sqrt": return "√("+T(n.f.r)+")";
      case "root": return T(n.f.i)+"√("+T(n.f.r)+")";
      case "paren": return "("+T(n.f.b)+")";
      case "abs": return "|"+T(n.f.b)+"|";
      case "fn": return n.v+"("+T(n.f.a)+(n.f.b?","+T(n.f.b):"")+")";
      case "int": return "∫["+T(n.f.lo)+","+T(n.f.hi)+"]("+T(n.f.b)+")dX";
      case "der": return "d/dX("+T(n.f.b)+")|"+T(n.f.p);
      case "sum": return n.v+"["+T(n.f.lo)+","+T(n.f.hi)+"]("+T(n.f.b)+")";
      case "dms": return T(n.f.d)+"°"+T(n.f.m)+"′"+T(n.f.s)+"″";
    }
    return "";
  }).join("");
}

function resultContent(v){
  resEl.innerHTML = "";
  resEl.classList.remove("err");
  resEl.dataset.v = v === null ? "" : String(v);
  if(v === null){
    resEl.textContent = S.root.length ? "" : "0";
    return;
  }
  if(D.base !== "DEC"){
    const b = baseStr(v);
    if(b){ resEl.textContent = b; return; }
  }
  if(D.dms){ resEl.textContent = dmsStr(v); return; }
  if(D.sd > 0 && isFinite(v)){
    const f = toFrac(v);
    if(f){
      if(D.sd === 2 && Math.abs(f.n) > f.d && f.d > 1){
        const sg = f.n<0?-1:1;
        const w = Math.floor(Math.abs(f.n)/f.d);
        const rn = Math.abs(f.n)-w*f.d;
        const mx = mk("mixed");
        mx.f.w = [num(sg*w)]; mx.f.n = [num(rn)]; mx.f.d = [num(f.d)];
        resEl.appendChild(renderNode(mx));
        return;
      }
      if(f.d === 1){
        resEl.textContent = group(String(f.n).replace("-","−"));
        return;
      }
      if(f.n < 0) resEl.appendChild(txt("−"));
      const fr = mk("frac");
      fr.f.n = [num(Math.abs(f.n))];
      fr.f.d = [num(f.d)];
      resEl.appendChild(renderNode(fr));
      return;
    }
  }
  if(!isFinite(v)){ resEl.textContent = v>0?"∞":"−∞"; return; }
  const s = D.fmt==="SCI" ? sciStr(v,D.prec) : D.fmt==="ENG" ? engStr(v,D.prec) : autoStr(v,D.prec);
  resEl.textContent = s;
}

function doKey(k, ev){

  }

  }

function applyIns(v){
  if(/^[0-9]$/.test(v)) return digit(v);
  if(v === ".") return dot();
  if(["+","−","×","÷","mod"].includes(v)) return op(v);
  if(v === "!") return ins({t:"post",v:"!"});
  if(v === "%") return ins({t:"post",v:"%"});
  if(["π","e","∞","Ans","M","X","Y"].includes(v)) return ins(konst(v));
  if(v === "(") return ins(mk("paren"),"b");
  if(v === ")") return closeParen();
  if(v === "abs") return ins(mk("abs"),"b");
  if(v === "frac") return ins(mk("frac"),"n");
  if(v === "mixed") return ins(mk("mixed"),"w");
  if(v === "sqrt") return ins(mk("sqrt"),"r");
  if(v === "cbrt"){ const n = mk("root"); n.f.i = [num(3)]; return ins(n,"r"); }
  if(v === "nroot") return ins(mk("root"),"i");
  if(v === "pow") return powKey();
  if(v === "pow2") return powKey("2");
  if(v === "pow3") return powKey("3");
  if(v === "inv") return powKey("−1");
  if(v === "e^") return powBase(konst("e"));
  if(v === "10^") return powBase(num(10));
  if(v === "exp10"){ op("×"); return powBase(num(10)); }
  if(v === "int") return ins(mk("int"),"lo");
  if(v === "der") return ins(mk("der"),"b");
  if(v === "sum") return ins(mk("sum","Σ"),"lo");
  if(v === "prod") return ins(mk("sum","Π"),"lo");
  if(v === "dms") return ins(mk("dms"),"d");
  if(["ln","log","logxy","nCr","nPr"].includes(v)) return ins(mk("fn",v),"a");
}
function act(a){
  let v;
  switch(a){
    case "left": S.fresh=false; left(); render(); break;
    case "right": S.fresh=false; right(); render(); break;
    case "comma": S.fresh=false; comma(); render(); break;
    case "del": backspace(); break;
    case "delnode": delNode(); break;
    case "ac":
      pushUndo();
      S.root=[]; S.root.meta=null; S.cur={arr:S.root,i:0};
      S.fresh=false; S.hyp=false; S.err=false;
      render(); break;
    case "neg": neg(); break;
    case "drg":
      D.angle = D.angle==="DEG"?"RAD":D.angle==="RAD"?"GRAD":"DEG";
      save(); render(); break;
    case "hyp": S.hyp=!S.hyp; render(); break;
    case "fse":
      D.fmt = D.fmt==="AUTO"?"SCI":D.fmt==="SCI"?"ENG":"AUTO";
      save(); render(); break;
    case "sd": D.sd=(D.sd+1)%3; save(); render(); break;
    case "bin": D.base=D.base==="BIN"?"DEC":"BIN"; save(); render(); break;
    case "oct": D.base=D.base==="OCT"?"DEC":"OCT"; save(); render(); break;
    case "hex": D.base=D.base==="HEX"?"DEC":"HEX"; save(); render(); break;
    case "dec": D.base="DEC"; save(); render(); break;
    case "dmsout": D.dms=!D.dms; save(); render(); break;
    case "mplus": v=live(); if(v!==null&&isFinite(v)){S.mem+=v;save();toast("M = "+autoStr(S.mem,D.prec));} render(); break;
    case "mminus": v=live(); if(v!==null&&isFinite(v)){S.mem-=v;save();toast("M = "+autoStr(S.mem,D.prec));} render(); break;
    case "mstore": v=live(); if(v!==null&&isFinite(v)){S.mem=v;save();toast("Αποθηκεύτηκε στη μνήμη");} render(); break;
    case "mr": ins(konst("M")); break;
    case "ran": ins(num(Math.random().toFixed(6))); break;
    case "menu": openSheet("menu"); break;
    case "eq": eq(false); break;
  }
}
function eq(collapse){

  });

}

        timer = setTimeout(()=>{
          fired = true;
          b.classList.remove("holding");
          vib(20);
          eq(true);
        }, 500);
      });
      const end = ()=>{ clearTimeout(timer); b.classList.remove("holding"); };
      b.addEventListener("pointerup", end);
      b.addEventListener("pointerleave", end);
      b.addEventListener("pointercancel", end);
      b.addEventListener("click", ()=>{
        if(fired){ fired = false; return; }
        doKey(k);
      });
      host.appendChild(b);
      continue;
    }
    if(k.a === "del"){
      let timer = null, fired = false;
      b.addEventListener("pointerdown", ()=>{
        fired = false;
        timer = setTimeout(()=>{ fired = true; act("ac"); toast("Πλήρης καθαρισμός"); }, 650);
      });
      const end = ()=>clearTimeout(timer);
      b.addEventListener("pointerup", end);
      b.addEventListener("pointerleave", end);
      b.addEventListener("pointercancel", end);
      b.addEventListener("click", ()=>{
        if(fired){ fired = false; return; }
        doKey(k);
      });
      host.appendChild(b);
      continue;
    }
    if(k.tab){
      b.addEventListener("click", ()=>{
        S.shift = false;
        vib(); clickSnd();
        openSheet(S.shift ? "conv" : k.tab);
      });
      b.addEventListener("click", ()=>{});
      host.appendChild(b);
      continue;
    }
    b.addEventListener("click", ()=>doKey(k));
    host.appendChild(b);
  }
}

/* ================= ΓΡΑΦΗΜΑ ================= */
const G = {x0:-10, x1:10, y0:-6, y1:6, tx:null};
let gcanvas = null, gctx = null, gread = null;
function gResize(){
  if(!gcanvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = gcanvas.clientWidth, h = gcanvas.clientHeight;
  gcanvas.width = w*dpr;
  gcanvas.height = h*dpr;
  gctx.setTransform(dpr,0,0,dpr,0,0);
  gDraw();
}
function niceStep(range){
  const raw = range/6;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]) if(pow*m >= raw) return pow*m;
  return pow*10;
}
function gDraw(){
  if(!gctx) return;
  const W = gcanvas.clientWidth, H = gcanvas.clientHeight;
  const css = getComputedStyle(document.body);
  const acc = css.getPropertyValue("--accent1").trim();
  const acc2 = css.getPropertyValue("--accent2").trim();
  const dim = css.getPropertyValue("--dim").trim();
  const tx = css.getPropertyValue("--keytx").trim();
  gctx.clearRect(0,0,W,H);
  const X = x=>(x-G.x0)/(G.x1-G.x0)*W;
  const Y = y=>H-(y-G.y0)/(G.y1-G.y0)*H;
  const sx = niceStep(G.x1-G.x0), sy = niceStep(G.y1-G.y0);
  gctx.font = "10px system-ui";
  gctx.lineWidth = 1;
  for(let x=Math.ceil(G.x0/sx)*sx; x<=G.x1; x+=sx){
    gctx.strokeStyle = dim+"33";
    gctx.beginPath(); gctx.moveTo(X(x),0); gctx.lineTo(X(x),H); gctx.stroke();
    gctx.fillStyle = dim;
    gctx.fillText(autoStr(x,4), X(x)+3, H-4);
  }
  for(let y=Math.ceil(G.y0/sy)*sy; y<=G.y1; y+=sy){
    gctx.strokeStyle = dim+"33";
    gctx.beginPath(); gctx.moveTo(0,Y(y)); gctx.lineTo(W,Y(y)); gctx.stroke();
    gctx.fillStyle = dim;
    gctx.fillText(autoStr(y,4), 4, Y(y)-3);
  }
  gctx.strokeStyle = tx+"88";
  gctx.lineWidth = 1.4;
  if(G.y0 < 0 && G.y1 > 0){ gctx.beginPath(); gctx.moveTo(0,Y(0)); gctx.lineTo(W,Y(0)); gctx.stroke(); }
  if(G.x0 < 0 && G.x1 > 0){ gctx.beginPath(); gctx.moveTo(X(0),0); gctx.lineTo(X(0),H); gctx.stroke(); }
  gctx.strokeStyle = acc;
  gctx.lineWidth = 2.2;
  gctx.shadowColor = acc;
  gctx.shadowBlur = D.motion ? 7 : 0;
  gctx.beginPath();
  let pen = false;
  for(let px=0; px<=W; px+=2){
    const x = G.x0 + px/W*(G.x1-G.x0);
    let y = null;
    try{ y = evArr(S.root, {X:x}); }catch(e){}
    if(y === null || !isFinite(y) || y > G.y1+(G.y1-G.y0)*2 || y < G.y0-(G.y1-G.y0)*2){ pen = false; continue; }
    const py = Y(y);
    if(!pen){ gctx.moveTo(px,py); pen = true; }
    else gctx.lineTo(px,py);
  }
  gctx.stroke();
  gctx.shadowBlur = 0;
  if(G.tx !== null){
    let y = null;
    try{ y = evArr(S.root, {X:G.tx}); }catch(e){}
    if(y !== null && isFinite(y)){
      gctx.fillStyle = acc2;
      gctx.beginPath();
      gctx.arc(X(G.tx), Y(y), 5, 0, Math.PI*2);
      gctx.fill();
      gread.textContent = "x = "+autoStr(G.tx,6)+"   y = "+autoStr(y,8);
    } else gread.textContent = "x = "+autoStr(G.tx,6)+"   y = μη ορισμένο";
  } else gread.textContent = "Πάτα την καμπύλη για τιμές · σύρε για μετακίνηση · τσίμπα για ζουμ";
}
function gZoom(f, cx, cy){
  const mx = cx===undefined ? (G.x0+G.x1)/2 : cx;
  const my = cy===undefined ? (G.y0+G.y1)/2 : cy;
  G.x0 = mx+(G.x0-mx)*f; G.x1 = mx+(G.x1-mx)*f;
  G.y0 = my+(G.y0-my)*f; G.y1 = my+(G.y1-my)*f;
  gDraw();
}
function buildGraph(){
  ptitle.textContent = "Γράφημα της τρέχουσας πράξης ως f(X)";
  const wrap = el("div"); wrap.id = "gwrap";
  gcanvas = el("canvas"); gcanvas.id = "gcanvas";
  wrap.appendChild(gcanvas);
  const tools = el("div"); tools.id = "gtools";
  const mkB = (label, fn)=>{
    const b = el("button"); b.type = "button"; b.textContent = label;
    b.addEventListener("click", ()=>{ fn(); vib(); });
    tools.appendChild(b);
  };
  mkB("+ Ζουμ", ()=>gZoom(.75));
  mkB("− Ζουμ", ()=>gZoom(1.33));
  mkB("⟲ Επαναφορά", ()=>{ Object.assign(G,{x0:-10,x1:10,y0:-6,y1:6,tx:null}); gDraw(); });
  mkB("✕ Ίχνος", ()=>{ G.tx = null; gDraw(); });
  gread = el("div"); gread.id = "gread";
  pbody.append(wrap, tools, gread);
  gctx = gcanvas.getContext("2d");
  requestAnimationFrame(gResize);
  const pts = new Map();
  let lastDist = 0, moved = 0, lastX = 0, lastY = 0;
  gcanvas.addEventListener("pointerdown", e=>{
    gcanvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    moved = 0;
    lastX = e.clientX; lastY = e.clientY;
    if(pts.size === 2){
      const [a,b] = [...pts.values()];
      lastDist = Math.hypot(a.x-b.x, a.y-b.y);
    }
  });
  gcanvas.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const W = gcanvas.clientWidth, H = gcanvas.clientHeight;
    if(pts.size === 1){
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      moved += Math.abs(dx)+Math.abs(dy);
      G.x0 -= dx*(G.x1-G.x0)/W; G.x1 -= dx*(G.x1-G.x0)/W;
      G.y0 += dy*(G.y1-G.y0)/H; G.y1 += dy*(G.y1-G.y0)/H;
      lastX = e.clientX; lastY = e.clientY;
      gDraw();
    } else if(pts.size === 2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(lastDist > 0){
        const r = gcanvas.getBoundingClientRect();
        const cx = G.x0+((a.x+b.x)/2-r.left)/W*(G.x1-G.x0);
        const cy = G.y1-((a.y+b.y)/2-r.top)/H*(G.y1-G.y0);
        gZoom(lastDist/d, cx, cy);
      }
      lastDist = d;
      moved = 99;
    }
  });
  const up = e=>{
    if(pts.size === 1 && moved < 6){
      const r = gcanvas.getBoundingClientRect();
      G.tx = G.x0+(e.clientX-r.left)/gcanvas.clientWidth*(G.x1-G.x0);
      gDraw();
    }
    pts.delete(e.pointerId);
    lastDist = 0;
  };
  gcanvas.addEventListener("pointerup", up);
  gcanvas.addEventListener("pointercancel", up);
  gcanvas.addEventListener("wheel", e=>{
    e.preventDefault();
    const r = gcanvas.getBoundingClientRect();
    const cx = G.x0+(e.clientX-r.left)/gcanvas.clientWidth*(G.x1-G.x0);
    const cy = G.y1-(e.clientY-r.top)/gcanvas.clientHeight*(G.y1-G.y0);
    gZoom(e.deltaY > 0 ? 1.15 : .87, cx, cy);
  }, {passive:false});
}

modal.addEventListener("click", e=>{ if(e.target === modal) closeModal(); });
function cmpVer(a,b){
  const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
  for(let i=0;i<3;i++){
    if((pa[i]||0) > (pb[i]||0)) return 1;
    if((pa[i]||0) < (pb[i]||0)) return -1;
  }
  return 0;
}
function askUpdate(){
  if(sessionStorage.getItem("updOk") === "1") return doCheck();
  mcard.innerHTML = "";
  const h = el("h3"); h.textContent = "Πρόσβαση στο διαδίκτυο";
  const p = el("p");
  p.textContent = "Ο έλεγχος ενημέρωσης χρειάζεται μία σύνδεση στο αποθετήριο στο GitHub για να διαβάσει το αρχείο εκδόσεων. Καμία άλλη χρήση δικτύου, κανένα δεδομένο δεν φεύγει από τη συσκευή.";
  const lab = el("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  lab.append(cb, txt("Να μην ερωτηθώ ξανά σε αυτή τη συνεδρία"));
  const mr = el("div","mrow");
  const no = el("button"); no.textContent = "Ακύρωση";
  no.addEventListener("click", closeModal);
  const yes = el("button","go"); yes.textContent = "Αποδοχή";
  yes.addEventListener("click", ()=>{
    if(cb.checked) sessionStorage.setItem("updOk","1");
    closeModal();
    doCheck();
  });
  mr.append(no,yes);
  mcard.append(h,p,lab,mr);
  modal.hidden = false;
}
async function doCheck(){
  const btn = document.getElementById("updbtn");
  if(!navigator.onLine){ toast("Δεν υπάρχει σύνδεση στο διαδίκτυο"); return; }
  btn.classList.add("spin");
  toast("Έλεγχος για νέα έκδοση…", 4000);
  try{
    const res = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw 0;
    const j = await res.json();
    btn.classList.remove("spin");
    if(cmpVer(j.version, APP_VERSION) > 0){
      mcard.innerHTML = "";
      const h = el("h3"); h.textContent = "Νέα έκδοση "+j.version;
      const p = el("p"); p.textContent = "Έχεις την "+APP_VERSION+". Τι αλλάζει:";
      const ul = el("ul");
      for(const n of (j.notes||[])){
        const li = el("li"); li.textContent = n; ul.appendChild(li);
      }
      const mr = el("div","mrow");
      const no = el("button"); no.textContent = "Αργότερα";
      no.addEventListener("click", closeModal);
      const yes = el("button","go"); yes.textContent = "Ενημέρωση τώρα";
      yes.addEventListener("click", async ()=>{
        yes.disabled = true;
        yes.textContent = "Ενημέρωση…";
        try{
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
          const ks = await caches.keys();
          await Promise.all(ks.map(k=>caches.delete(k)));
        }catch(e){}
        location.reload();
      });
      mr.append(no,yes);
      mcard.append(h,p,ul,mr);
      modal.hidden = false;
      vib([15,60,15]);
    } else {
      toast("Είσαι στην τελευταία έκδοση ("+APP_VERSION+")");
    }
  }catch(e){
    btn.classList.remove("spin");
    toast("Αποτυχία ελέγχου — δοκίμασε ξανά");
  }
}

/* ================= ΠΛΗΚΤΡΟΛΟΓΙΟ ================= */
document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("keydown", e=>{
  if(!sheet.hidden || !modal.hidden) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  const k = e.key;
  if(/^[0-9]$/.test(k)) digit(k);
  else if(k === ".") dot();
  else if(k === "+") op("+");
  else if(k === "-") op("−");
  else if(k === "*") op("×");
  else if(k === "/") op("÷");
  else if(k === "(") ins(mk("paren"),"b");
  else if(k === ")") closeParen();
  else if(k === "^") powKey();
  else if(k === "Enter" || k === "=") eq(false);
  else if(k === "Backspace") backspace();
  else if(k === "Delete") delNode();
  else if(k === "ArrowLeft"){ left(); render(); }
  else if(k === "ArrowRight"){ right(); render(); }
  else if(k === ","){ comma(); render(); }
  else return;
  e.preventDefault();
});

(function init(){
  try{
    const e = JSON.parse(localStorage.getItem("sciCalc3.expr"));
    if(e && e.t){
      S.root = deserialize(e.t);
      setCurPath(e.p||[], e.i||0);
    }
  }catch(err){}
  applyTheme();
  undoBtns();
  render();
  if("serviceWorker" in navigator)
    addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
